name: pixel_paper
description: "Scanner di documenti e archivio PDF per Android."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Stato e navigazione
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Persistenza
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Acquisizione
  google_mlkit_document_scanner: ^0.6.1
  camera: ^0.12.1
  image_picker: ^1.2.1

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2
  syncfusion_flutter_pdf: ^34.2.6

  # Utilita
  share_plus: ^13.3.0
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  google_mlkit_text_recognition: ^0.17.1
  pro_image_editor: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang.json
