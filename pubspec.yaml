name: pixel_paper
description: "Scanner di documenti e archivio PDF per Android, privacy first."
publish_to: 'none'
version: 3.2.0+26092001

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Every dependency is open source (MIT, BSD or Apache 2.0) and works offline.
dependencies:
  flutter:
    sdk: flutter

  # State, navigation, motion
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  animations: ^3.0.0

  # Storage
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1

  # Capture
  google_mlkit_document_scanner: ^0.6.1
  google_mlkit_text_recognition: ^0.17.1
  camera: ^0.12.2
  permission_handler: ^13.0.2
  image_picker: ^1.2.4

  # Images and PDF
  image: ^4.12.0
  pdf: ^3.13.1
  pdfrx: ^2.10.1
  printing: ^5.15.1
  pro_image_editor: ^14.21.1

  # Sharing and export
  share_plus: ^13.3.1
  flutter_file_dialog: ^3.3.3
  saf_util: ^3.1.1
  saf_stream: ^4.0.3

  # Utilities
  intl: ^0.20.3
  crypto: ^3.0.8
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

  # Material as a package, decoupled from the SDK (needed by pro_image_editor 14)
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/lang.json
