# Controlla ogni push e pull request; su un tag "v*" costruisce l'APK di
# release firmato e lo pubblica come GitHub Release.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['web/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '27'

jobs:
  verify:
    name: Analisi e test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get --enforce-lockfile

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analisi (warning, info e unused sono errori)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter=github

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  smoke-android:
    name: Smoke test Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test/app_smoke_test.dart -d emulator-5554 --no-pub

  build:
    name: Build di controllo
    needs: [verify, smoke-android]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: APK release (firma di debug, solo verifica)
        run: flutter build apk --release
      - name: Permessi
        run: bash tool/check_permissions.sh build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Release
    needs: [verify, smoke-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Il tag coincide con la versione del pubspec
        run: |
          version="$(sed -nE 's/^version: ([0-9.]+)\+.*/\1/p' pubspec.yaml)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Il tag ${GITHUB_REF_NAME} non corrisponde a version: ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Mancano i secret di firma: una release non si firma con la chiave di debug."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get --enforce-lockfile

      - name: APK ottimizzati (offuscati, uno per architettura + universale)
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --split-per-abi
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Permessi
        run: bash tool/check_permissions.sh build/app/outputs/flutter-apk/app-*release.apk

      - name: Nomi, checksum e note
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          for apk in app-*release.apk; do
            case "$apk" in
              app-release.apk) abi="universale" ;;
              *) abi="${apk#app-}"; abi="${abi%-release.apk}" ;;
            esac
            cp "$apk" "../../../../dist/PixelPaper-${VERSION}-${abi}.apk"
          done
          cd ../../../../dist
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          tar -czf "dist/simboli-debug-${VERSION}.tar.gz" -C build symbols
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > dist/NOTE.md

      - uses: softprops/action-gh-release@v2
        with:
          name: PixelPaper ${{ env.VERSION }}
          body_path: dist/NOTE.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/simboli-debug-*.tar.gz

      - name: Pulizia della chiave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
