# Pubblica la guida (cartella web/) su GitHub Pages.
#
# Nessuna compilazione: il sito e' HTML e CSS statici, senza dipendenze. Il
# workflow precedente costruiva l'app con `flutter build web` — impossibile
# ora che PixelPaper e' solo Android: ML Kit, la fotocamera e sqflite sul web
# non esistono, e la build fallirebbe a ogni push.
name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'web'

      - id: deployment
        uses: actions/deploy-pages@v5
